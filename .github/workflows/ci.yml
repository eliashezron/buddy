name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: wa
          POSTGRES_PASSWORD: wa
          POSTGRES_DB: wa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wa -d wa" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgres://wa:wa@localhost:5432/wa
      TEST_DATABASE_URL: postgres://wa:wa@localhost:5432/wa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable pnpm
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm build
      # Tool-selection evals hit the live model. Without the secret they skip
      # (exit 0); with it, a drop below evals/baseline.json fails the build.
      - run: pnpm evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
